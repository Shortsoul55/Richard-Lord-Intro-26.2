<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open API Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/openapi.css">
</head>
<body>
    <div class="clouds">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div id="app-container">

        <nav>
            <a href="index.html">Home</a>
        </nav>

        <header>
            <h1>Open API Project</h1>
            <p>This project demonstrates how to use an Open API to fetch and display data on a webpage.</p>
        </header>

        <!-- Search + Toggle Row -->
        <div id="search-box">
            <input id="city-input" type="text" placeholder="Enter a city..." />
            <button id="current-btn">Current Weather</button>
            <button id="forecast-btn">7-Day Forecast</button>
            <button id="temp-toggle">Switch to °F</button>
        </div>

        <!-- Weather Cards -->
        <section id="api-call-1">
            <h2>Current Weather</h2>
            <div id="data-container" class="weather-card"></div>
        </section>

        <section id="api-call-2">
            <h2>7‑Day Forecast</h2>
            <div id="data-container-2" class="weather-card"></div>
        </section>

    </div>

    <script defer src="js/openapi.js"></script>
</body>
</html>
